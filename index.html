<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="./vite.svg" type="image/svg+xml" />
    <title>拼图游戏</title>
    <script type="module" crossorigin src="./assets/index-1oR75cPu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/Geometry-4kYaQtTW.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-BxocRSPM.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-B-hsF7vt.js">
    <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-BQvZHUJS.js">
    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-CnG2LLJU.js">
    <link rel="modulepreload" crossorigin href="./assets/BufferResource-t1eUrra0.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CJvv1Lrn.css">
  </head>

  <body>
    <div id="app"></div>
    <div id="ui">
      <form>
        <fieldset>
          <label>
            列数:
            <span id="columns-label">20</span>
            <input
              id="columns"
              name="columns"
              type="range"
              min="2"
              max="80"
              value="20"
              step="1"
            />
          </label>
          <label>
            行数:
            <span id="rows-label">20</span>
            <input
              id="rows"
              name="rows"
              type="range"
              min="2"
              max="80"
              value="20"
              step="1"
            />
          </label>
          <p class="piece-count"><span id="piece-count">共 400 块</span></p>
          <button type="button" id="upload">选择图片</button>
          <input type="file" id="file-upload" accept="image/*" hidden />
          <button type="button" id="start">开始</button>
          <small>也可把图片拖到页面中。开始后可用 C 居中，滚轮缩放。</small>
        </fieldset>
      </form>
      <div class="preview" hidden>
        <img id="preview-image" alt="预览图" />
        <svg id="preview-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="game-control">
        <button id="control-settings" data-tooltip="显示设置" data-placement="bottom" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

            ></path>
          </svg>
        </button>
        <button id="control-tip" data-tooltip="操作说明" data-placement="bottom" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
            <path
              fill="currentColor"
              d="M512 64a448 448 0 1 1 0 896.064A448 448 0 0 1 512 64m67.2 275.072c33.28 0 60.288-23.104 60.288-57.344s-27.072-57.344-60.288-57.344c-33.28 0-60.16 23.104-60.16 57.344s26.88 57.344 60.16 57.344M590.912 699.2c0-6.848 2.368-24.64 1.024-34.752l-52.608 60.544c-10.88 11.456-24.512 19.392-30.912 17.28a12.992 12.992 0 0 1-8.256-14.72l87.68-276.992c7.168-35.136-12.544-67.2-54.336-71.296-44.096 0-108.992 44.736-148.48 101.504 0 6.784-1.28 23.68.064 33.792l52.544-60.608c10.88-11.328 23.552-19.328 29.952-17.152a12.8 12.8 0 0 1 7.808 16.128L388.48 728.576c-10.048 32.256 8.96 63.872 55.04 71.04 67.84 0 107.904-43.648 147.456-100.416z"
            ></path>
          </svg>
        </button>
        <button id="control-aim" data-tooltip="居中画布" data-placement="bottom" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
            <path
              fill="currentColor"
              d="M512 896a384 384 0 1 0 0-768 384 384 0 0 0 0 768m0 64a448 448 0 1 1 0-896 448 448 0 0 1 0 896"
            ></path>
            <path
              fill="currentColor"
              d="M512 96a32 32 0 0 1 32 32v192a32 32 0 0 1-64 0V128a32 32 0 0 1 32-32m0 576a32 32 0 0 1 32 32v192a32 32 0 1 1-64 0V704a32 32 0 0 1 32-32M96 512a32 32 0 0 1 32-32h192a32 32 0 0 1 0 64H128a32 32 0 0 1-32-32m576 0a32 32 0 0 1 32-32h192a32 32 0 1 1 0 64H704a32 32 0 0 1-32-32"

          </svg>
        </button>
        <button id="control-refresh" data-tooltip="重新开始" data-placement="bottom" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
            <path
              fill="currentColor"
              d="M771.776 794.88A384 384 0 0 1 128 512h64a320 320 0 0 0 555.712 216.448H654.72a32 32 0 1 1 0-64h149.056a32 32 0 0 1 32 32v148.928a32 32 0 1 1-64 0v-50.56zM276.288 295.616h92.992a32 32 0 0 1 0 64H220.16a32 32 0 0 1-32-32V178.56a32 32 0 0 1 64 0v50.56A384 384 0 0 1 896.128 512h-64a320 320 0 0 0-555.776-216.384z"
            ></path>
          </svg>
        </button>
        <span id="progress-stat">进度: <strong>0/0</strong></span>
        <span id="fps">FPS: <strong>0</strong></span>
        <span id="timer">用时: <strong>0:00</strong></span>
      </div>
      <div id="loading" hidden>
        <article>
          <p id="loading-text">正在生成拼图...</p>
          <progress id="loading-progress" value="0" max="1"></progress>
        </article>
      </div>
    </div>
    <dialog id="settings-dialog">
      <article>
        <header>
          <button class="close" aria-label="Close" rel="prev" type="button" id="settings-close"></button>
          <p><strong>显示设置</strong></p>
        </header>
        <label>
          <input type="checkbox" id="setting-stroke" role="switch" />
          显示描边
        </label>
        <label>
          描边颜色
          <input id="setting-border-color" type="color" value="#8bc5ff" />
        </label>
        <label>
          背景颜色
          <input id="setting-bg-color" type="color" value="#111111" />
        </label>
      </article>
    </dialog>
  </body>
</html>
